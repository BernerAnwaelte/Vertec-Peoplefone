<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Vertec → peoplefone Wählhilfe – Einstellungen</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 660px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.3rem; }
    h2 { font-size: 1.05rem; margin-top: 2rem; border-bottom: 1px solid #ddd; padding-bottom: .3rem; }
    label { display: block; margin-top: 1.1rem; font-weight: 600; }
    small { display: block; color: #555; font-weight: normal; margin-top: .2rem; }
    input[type=text], input[type=password], input[type=number], textarea { width: 100%; box-sizing: border-box; padding: .45rem; font: inherit; }
    textarea { height: 4.5rem; }
    button { margin-top: 1.4rem; margin-right: .5rem; padding: .5rem 1.2rem; font: inherit; cursor: pointer; }
    #status { display: block; margin-top: 1rem; white-space: pre-wrap; }
    .ok { color: #0a7a2f; } .err { color: #b00020; }
    code { background: #f2f2f2; padding: 0 .25rem; }
  </style>
</head>
<body>
  <h1>Vertec → peoplefone Wählhilfe</h1>

  <h2>Verbindung zu Vertec</h2>

  <label for="vertecUrl">Vertec-Adresse
    <small>Die Adresse Ihres Vertec Cloud Servers, z.B. <code>https://firma.vertec-cloud.ch</code> (von der IT).</small>
  </label>
  <input id="vertecUrl" type="text" spellcheck="false" placeholder="https://…">

  <label for="webserviceName">Name des Webservice
    <small>„Name (Subpath)“ des Webservice in Vertec. Standard: <code>peoplefone</code></small>
  </label>
  <input id="webserviceName" type="text" spellcheck="false">

  <label for="apiToken">API-Token
    <small>API-Token des technischen Vertec-Benutzers für die Wählhilfe (von der IT).</small>
  </label>
  <input id="apiToken" type="password" autocomplete="off" spellcheck="false">

  <label for="pairingCode">Persönlicher Kopplungscode
    <small>Wird in Vertec beim ersten „Mit peoplefone anrufen“ angezeigt
      (oder über „peoplefone: Kopplungscode anzeigen“).</small>
  </label>
  <input id="pairingCode" type="password" autocomplete="off" spellcheck="false">

  <h2>Wählen</h2>

  <label for="countryCode">Landesvorwahl (ohne 00 / +)</label>
  <input id="countryCode" type="text">

  <label for="delayMs">Wartezeit nach dem Öffnen des Softphones (Millisekunden)
    <small>Nur relevant, wenn das Softphone noch nicht offen war. Bei Bedarf erhöhen.</small>
  </label>
  <input id="delayMs" type="number" min="0" step="500">

  <label for="pollMs">Abfrageintervall (Millisekunden)
    <small>Wie oft bei Vertec nach neuen Wählaufträgen gefragt wird. Standard 2000.</small>
  </label>
  <input id="pollMs" type="number" min="1000" step="500">

  <label><input id="confirmBeforeDial" type="checkbox"> Vor dem Wählen nachfragen</label>

  <label for="blockedPrefixes">Gesperrte Nummern-Präfixe (eines pro Zeile, internationales Format)</label>
  <textarea id="blockedPrefixes" spellcheck="false"></textarea>

  <label for="softphoneUrl">Softphone-Adresse
    <small>Standard: https://softphone.peoplefone.com/</small>
  </label>
  <input id="softphoneUrl" type="text" spellcheck="false">

  <button id="save" type="button">Speichern und Verbindung testen</button>
  <span id="status"></span>

  <script type="module" src="options.js"></script>
</body>
</html>
